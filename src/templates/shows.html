{% extends 'base.html' %}

{% block title %}Shows Browser - TVMaze-Sync{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Header -->
    <div>
        <h1 class="text-2xl font-bold leading-7 text-gray-900 dark:text-gray-100 sm:truncate sm:text-3xl sm:tracking-tight">
            Shows Browser
        </h1>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
            Browse and search the cached TV shows database
        </p>
    </div>

    <!-- Filters -->
    <div class="bg-white shadow rounded-lg p-4 dark:bg-gray-800 dark:shadow-none dark:ring-1 dark:ring-white/10">
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
            <!-- Search -->
            <div class="sm:col-span-2">
                <label for="search" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Search</label>
                <input type="text"
                       name="search"
                       id="search"
                       placeholder="Search by title..."
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2 border dark:bg-gray-900 dark:border-gray-600 dark:text-gray-100 dark:placeholder-gray-500"
                       hx-get="{{ url_for('ui_partial_shows') }}"
                       hx-trigger="keyup changed delay:500ms"
                       hx-target="#shows-table"
                       hx-include="[name='status']">
            </div>

            <!-- Status Filter -->
            <div>
                <label for="status" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Status</label>
                <select name="status"
                        id="status"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2 border dark:bg-gray-900 dark:border-gray-600 dark:text-gray-100"
                        hx-get="{{ url_for('ui_partial_shows') }}"
                        hx-trigger="change"
                        hx-target="#shows-table"
                        hx-include="[name='search']">
                    <option value="">All Statuses</option>
                    <option value="added">Added</option>
                    <option value="filtered">Filtered</option>
                    <option value="pending_tvdb">Pending TVDB</option>
                    <option value="pending">Pending</option>
                    <option value="failed">Failed</option>
                    <option value="exists">Exists</option>
                    <option value="abandoned">Abandoned</option>
                </select>
            </div>

            <!-- Reset Button -->
            <div class="flex items-end">
                <button type="button"
                        onclick="document.getElementById('search').value=''; document.getElementById('status').value=''; htmx.trigger('#status', 'change');"
                        class="inline-flex items-center rounded-md bg-gray-100 px-3 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600">
                    <svg class="-ml-0.5 mr-1.5 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                    </svg>
                    Reset
                </button>
            </div>
        </div>
    </div>

    <!-- Shows Table -->
    <div class="bg-white shadow rounded-lg overflow-hidden dark:bg-gray-800 dark:shadow-none dark:ring-1 dark:ring-white/10">
        <div id="shows-table"
             hx-get="{{ url_for('ui_partial_shows') }}"
             hx-trigger="load"
             hx-swap="innerHTML">
            <!-- Loading skeleton -->
            <div class="p-8 text-center">
                <div class="animate-pulse space-y-4">
                    <div class="h-4 bg-gray-200 rounded w-3/4 mx-auto dark:bg-gray-700"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/2 mx-auto dark:bg-gray-700"></div>
                    <div class="h-4 bg-gray-200 rounded w-2/3 mx-auto dark:bg-gray-700"></div>
                </div>
                <p class="mt-4 text-sm text-gray-500 dark:text-gray-400">Loading shows...</p>
            </div>
        </div>
    </div>
</div>

<!-- Show Detail Modal -->
<div id="show-modal" class="relative z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto">
        <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
            <div class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-2xl dark:bg-gray-800 dark:ring-1 dark:ring-white/10">
                <div id="modal-content">
                    <!-- Content loaded via HTMX -->
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6 dark:bg-gray-900/50">
                    <button type="button"
                            onclick="closeModal()"
                            class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto dark:bg-gray-800 dark:text-gray-100 dark:ring-gray-600 dark:hover:bg-gray-700">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function showModal(tvmazeId) {
    htmx.ajax('GET', '/ui/partials/show/' + tvmazeId, {target: '#modal-content', swap: 'innerHTML'});
    document.getElementById('show-modal').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('show-modal').classList.add('hidden');
}

// Close modal on escape key
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeModal();
    }
});

// Close modal on backdrop click
document.getElementById('show-modal').addEventListener('click', function(e) {
    if (e.target === this || e.target.classList.contains('bg-gray-500')) {
        closeModal();
    }
});
</script>
{% endblock %}
