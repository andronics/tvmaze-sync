<nav class="bg-white shadow-sm border-b border-gray-200 dark:bg-gray-900 dark:border-gray-800">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 justify-between">
            <div class="flex">
                <div class="flex flex-shrink-0 items-center">
                    <svg class="h-8 w-8 text-primary" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 20.25h12m-7.5-3v3m3-3v3m-10.125-3h17.25c.621 0 1.125-.504 1.125-1.125V4.875c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125Z" />
                    </svg>
                    <span class="ml-2 text-xl font-semibold text-gray-900 dark:text-gray-100">TVMaze-Sync</span>
                </div>
                <div class="hidden sm:ml-8 sm:flex sm:space-x-4">
                    {% for item in nav_items %}
                    <a href="{{ item.url }}"
                       class="inline-flex items-center px-3 py-2 text-sm font-medium rounded-md {% if current_path == item.url %}bg-gray-100 text-gray-900 dark:bg-gray-800 dark:text-gray-100{% else %}text-gray-500 hover:bg-gray-50 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-gray-200{% endif %}">
                        {{ item.name }}
                    </a>
                    {% endfor %}
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <!-- Sync status indicator -->
                <div id="nav-sync-status"
                     hx-get="{{ url_for('ui_partial_nav_status') }}"
                     hx-trigger="every 10s"
                     hx-swap="innerHTML">
                    {% include 'partials/nav_status.html' %}
                </div>
                <!-- Theme toggle -->
                <button type="button"
                        onclick="toggleTheme()"
                        aria-label="Toggle dark mode"
                        class="rounded-md p-1.5 text-gray-500 hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-gray-200">
                    <!-- Sun icon (shown in dark mode) -->
                    <svg class="hidden h-5 w-5 dark:block" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
                    </svg>
                    <!-- Moon icon (shown in light mode) -->
                    <svg class="h-5 w-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                    </svg>
                </button>
                <a href="{{ url_for('ui_logout') }}"
                   class="text-sm text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                    Logout
                </a>
            </div>
        </div>
    </div>

    <!-- Mobile menu -->
    <div class="sm:hidden" id="mobile-menu">
        <div class="space-y-1 px-2 pb-3 pt-2">
            {% for item in nav_items %}
            <a href="{{ item.url }}"
               class="block px-3 py-2 text-base font-medium rounded-md {% if current_path == item.url %}bg-gray-100 text-gray-900 dark:bg-gray-800 dark:text-gray-100{% else %}text-gray-500 hover:bg-gray-50 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-gray-200{% endif %}">
                {{ item.name }}
            </a>
            {% endfor %}
        </div>
    </div>
</nav>
