<nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 justify-between">
            <div class="flex">
                <div class="flex flex-shrink-0 items-center">
                    <svg class="h-8 w-8 text-primary" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 20.25h12m-7.5-3v3m3-3v3m-10.125-3h17.25c.621 0 1.125-.504 1.125-1.125V4.875c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125Z" />
                    </svg>
                    <span class="ml-2 text-xl font-semibold text-gray-900">TVMaze-Sync</span>
                </div>
                <div class="hidden sm:ml-8 sm:flex sm:space-x-4">
                    {% for item in nav_items %}
                    <a href="{{ item.url }}"
                       class="inline-flex items-center px-3 py-2 text-sm font-medium rounded-md {% if current_path == item.url %}bg-gray-100 text-gray-900{% else %}text-gray-500 hover:bg-gray-50 hover:text-gray-700{% endif %}">
                        {{ item.name }}
                    </a>
                    {% endfor %}
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <!-- Sync status indicator -->
                <div id="nav-sync-status"
                     hx-get="{{ url_for('ui_partial_nav_status') }}"
                     hx-trigger="every 10s"
                     hx-swap="innerHTML">
                    {% include 'partials/nav_status.html' %}
                </div>
                <a href="{{ url_for('ui_logout') }}"
                   class="text-sm text-gray-500 hover:text-gray-700">
                    Logout
                </a>
            </div>
        </div>
    </div>

    <!-- Mobile menu -->
    <div class="sm:hidden" id="mobile-menu">
        <div class="space-y-1 px-2 pb-3 pt-2">
            {% for item in nav_items %}
            <a href="{{ item.url }}"
               class="block px-3 py-2 text-base font-medium rounded-md {% if current_path == item.url %}bg-gray-100 text-gray-900{% else %}text-gray-500 hover:bg-gray-50 hover:text-gray-700{% endif %}">
                {{ item.name }}
            </a>
            {% endfor %}
        </div>
    </div>
</nav>
